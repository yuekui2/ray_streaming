# Stateless Cross-Node Spegel P2P OCI Layer Distribution Stack.
#
# Deploys:
# 1. Headless Service (spegel-bootstrap) in ate-system for zero-control-plane
#    peer discovery across all worker nodes.
# 2. Per-node DaemonSet (ate-ocilayer-spegel) running:
#    - ocilayer-spegel: OCILayerService gRPC adapter + Spegel-compatible P2P
#      OCI registry mirror (:5000) backed by /var/lib/substrate/spegel.
#
# Usage:
#   ./hack/install-ate.sh --deploy-ate-system --setup-image-streaming=spegel
---
apiVersion: v1
kind: Service
metadata:
  name: spegel-bootstrap
  namespace: ate-system
  labels:
    app: spegel-bootstrap
    ate.dev/oci-layer-provider: spegel
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: ate-ocilayer-adapter
    ate.dev/oci-layer-provider: spegel
  ports:
  - name: registry
    port: 5000
    targetPort: 5000
    protocol: TCP
  - name: router
    port: 5001
    targetPort: 5001
    protocol: TCP
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ate-ocilayer-spegel-${SUBSTRATE_VERSION_SUFFIX}
  namespace: ate-system
  labels:
    app: ate-ocilayer-adapter
    ate.dev/oci-layer-provider: spegel
    ate.dev/substrate-version: "${SUBSTRATE_VERSION}"
spec:
  selector:
    matchLabels:
      app: ate-ocilayer-adapter
      ate.dev/oci-layer-provider: spegel
      ate.dev/substrate-version: "${SUBSTRATE_VERSION}"
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ate-ocilayer-adapter
        ate.dev/oci-layer-provider: spegel
        ate.dev/substrate-version: "${SUBSTRATE_VERSION}"
    spec:
      hostPID: true
      hostNetwork: true
      terminationGracePeriodSeconds: 5
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        ate.dev/substrate-version: "${SUBSTRATE_VERSION}"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: ate.dev/oci-layer-service
                operator: In
                values:
                - spegel
                - disabled
      tolerations:
      - key: ate.dev/sandboxClass
        operator: Exists
        effect: NoSchedule
      containers:
      - name: ocilayer-spegel
        image: ko://github.com/agent-substrate/substrate/cmd/ocilayer-spegel
        env:
        - name: SPEGEL_MIRROR_ADDR
          value: "http://127.0.0.1:5000"
        - name: SPEGEL_ROUTER_ADDR
          value: ":5001"
        - name: SPEGEL_BOOTSTRAP_DNS
          value: "spegel-bootstrap.ate-system.svc.cluster.local"
        args:
        - --listen-socket=/run/ate-image-streaming/ocilayer.sock
        - --store-dir=/var/lib/ateom-gvisor/streaming/spegel-store
        - --work-dir=/var/lib/ateom-gvisor/streaming/spegel
        - --docker-config=/run/ate-image-streaming/spegel/docker/config.json
        - --enable-p2p-server=true
        - --p2p-listen-addr=:5000
        - --spegel-peer-port=5000
        - --verify-spegel-ready=true
        - --idle-ttl=10m
        ports:
        - name: registry
          containerPort: 5000
          protocol: TCP
        - name: router
          containerPort: 5001
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5000
          initialDelaySeconds: 2
          periodSeconds: 5
        securityContext:
          privileged: true
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
        - name: kube-home
          mountPath: /home/kubernetes
        - name: host-ca-certs
          mountPath: /etc/ssl/certs
          readOnly: true
        - name: run-ate-image-streaming
          mountPath: /run/ate-image-streaming
        - name: run-ateom
          mountPath: /var/lib/ateom-gvisor
          mountPropagation: Bidirectional
      volumes:
      - name: kube-home
        hostPath:
          path: /home/kubernetes
          type: Directory
      - name: host-ca-certs
        hostPath:
          path: /etc/ssl/certs
          type: Directory
      - name: run-ate-image-streaming
        hostPath:
          path: /run/ate-image-streaming
          type: DirectoryOrCreate
      - name: run-ateom
        hostPath:
          path: /var/lib/ateom-gvisor
          type: DirectoryOrCreate
